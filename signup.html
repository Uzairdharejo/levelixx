<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sign up – Levelixx</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="site.css"></head>
<body>
<div class="wrap" data-page>
  <header class="bar">
    <a class="brand" href="index.html" aria-label="Levelixx Game Boosting"><span class="mark" aria-hidden="true">LX</span><span><b>Levelixx</b><small>Game Boosting</small></span></a>
    <nav aria-label="Pages"><a href="index.html">Home</a><a href="games.html">Games</a><a href="order.html">Order</a><a href="faq.html">FAQ</a></nav>
    <div class="auth" id="authSlot"></div>
  </header>
<div class="authwrap"><div class="card authcard">
      <h1>Sign up</h1>
      <p class="sub">Make an account to track your orders. It takes a minute.</p>
      <div id="msg" role="alert" hidden></div>
      <form id="signupForm" novalidate>
        <label for="uName">Your name<input id="uName" type="text" autocomplete="name" required placeholder="Name"></label>
        <label for="uWa">WhatsApp number<input id="uWa" type="tel" inputmode="numeric" autocomplete="tel" required placeholder="923001234567"></label>
        <label for="uEmail">Email<input id="uEmail" type="email" autocomplete="email" required placeholder="you@example.com"></label>
        <label for="uPass">Password (8+ characters)<input id="uPass" type="password" autocomplete="new-password" required minlength="8" placeholder="Choose a password"></label>
        <button class="btn" type="submit">Create account</button>
      </form>
      <p class="alt">Already have an account? <a href="login.html">Log in</a></p>
    </div></div>
  <footer>
    <div><b>LEVELIXX</b> Game Boosting</div>
    <div>Elite services / LX-Core / Est. 2023</div>
  </footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script src="site.js"></script>
</body></html>
